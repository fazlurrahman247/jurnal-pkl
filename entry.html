<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entry Jurnal PKL - Fazlur Rahman</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="profile-section">
          <div class="avatar">
            <i class="fas fa-user-graduate"></i>
          </div>
          <div class="profile-info">
            <h1>Fazlur Rahman</h1>
            <p class="company">
              <i class="fas fa-building"></i> Balai Penyuluhan KB
            </p>
            <p class="duration">
              <i class="fas fa-calendar-alt"></i> 4 Feb 2026 - 30 Jun 2026
            </p>
          </div>
        </div>
        <div class="header-actions">
          <a href="history.html" class="btn btn-secondary">
            <i class="fas fa-list"></i> Riwayat
          </a>
        </div>
      </header>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Form Section -->
        <section class="card form-section">
          <div class="card-header">
            <h2><i class="fas fa-pen-fancy"></i> Entri Jurnal Harian</h2>
          </div>
          <form id="journalForm" class="journal-form">
            <div class="form-row">
              <div class="form-group">
                <label for="date"
                  ><i class="fas fa-calendar"></i> Tanggal</label
                >
                <input type="date" id="date" name="date" required />
              </div>
              <div class="form-group">
                <label for="status"
                  ><i class="fas fa-user-check"></i> Status Kehadiran</label
                >
                <select id="status" name="status" required>
                  <option value="Hadir">Hadir</option>
                  <option value="Izin">Izin</option>
                  <option value="Sakit">Sakit</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="arrivalTime"
                  ><i class="fas fa-sign-in-alt"></i> Jam Datang</label
                >
                <input type="time" id="arrivalTime" name="arrivalTime" />
              </div>
              <div class="form-group">
                <label for="departureTime"
                  ><i class="fas fa-sign-out-alt"></i> Jam Pulang</label
                >
                <input type="time" id="departureTime" name="departureTime" />
              </div>
            </div>
            <div class="form-group">
              <label for="task"
                ><i class="fas fa-tasks"></i> Tugas yang Disuruh</label
              >
              <textarea
                id="task"
                name="task"
                rows="4"
                placeholder="Tuliskan tugas yang diperintahkan oleh pembimbing..."
              ></textarea>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Simpan Entri
              </button>
              <button
                type="reset"
                class="btn btn-outline"
                onclick="resetForm()"
              >
                <i class="fas fa-undo"></i> Reset
              </button>
            </div>
          </form>
        </section>
      </main>

      <!-- Footer -->
      <footer class="footer">
        <p>© 2026 Jurnal PKL - Fazlur Rahman | Balai Penyuluhan KB</p>
      </footer>
    </div>

    <script src="script-entry.js"></script>
  </body>
</html>
